<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="Emoji Riddles: 248 rebus puzzles across eight categories and four difficulty levels. Play alone or take turns with someone." />
<meta name="theme-color" content="#FAEDE3" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#1D1922" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Emoji Riddles" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%A7%A9</text></svg>" />
<link rel="manifest" href="/gemoji/manifest.webmanifest" />
<title>Emoji Riddles</title>
</head>
<body>
<style>
  :root {
    color-scheme: light dark;

    --paper:    #FAEDE3;
    --card:     #FFF8F3;
    --ink:      #2B2029;
    --ink-soft: #7C6A72;
    --pink:     #DC4C5C;
    --teal:     #1C776E;
    --line:     #E4CDBE;
    --on-pink:  #FFF6F2;

    --display: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
    --body:    system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono:    ui-monospace, "SF Mono", Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1D1922; --card: #292231; --ink: #F7E9E1; --ink-soft: #AC98A4;
      --pink: #FF7A87; --teal: #5CC3B3; --line: #3E3448; --on-pink: #2A1015;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1D1922; --card: #292231; --ink: #F7E9E1; --ink-soft: #AC98A4;
    --pink: #FF7A87; --teal: #5CC3B3; --line: #3E3448; --on-pink: #2A1015;
  }
  :root[data-theme="light"] {
    --paper: #FAEDE3; --card: #FFF8F3; --ink: #2B2029; --ink-soft: #7C6A72;
    --pink: #DC4C5C; --teal: #1C776E; --line: #E4CDBE; --on-pink: #FFF6F2;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  /* Halftone print texture, the thing that makes it read as riso */
  body::before {
    content: "";
    position: fixed; inset: 0; z-index: 0;
    pointer-events: none; opacity: .5;
    background-image: radial-gradient(circle at 50% 50%, var(--line) .9px, transparent 1px);
    background-size: 7px 7px;
  }

  #app {
    position: relative; z-index: 1;
    max-width: 460px; margin: 0 auto;
    padding: 22px 18px calc(28px + env(safe-area-inset-bottom));
    min-height: 100dvh;
    display: flex; flex-direction: column;
  }

  button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }

  .screen {
    display: flex; flex-direction: column; flex: 1; gap: 18px;
    animation: rise .3s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }

  /* ---------------- type ---------------- */
  .eyebrow {
    font-family: var(--mono); font-size: 11px;
    letter-spacing: .18em; text-transform: uppercase;
    color: var(--ink-soft); margin: 0;
  }
  h1 {
    font-family: var(--display); font-size: 36px; line-height: 1.02;
    font-weight: 800; letter-spacing: -.02em; margin: 8px 0 6px;
    text-wrap: balance;
  }
  .lede { margin: 0; color: var(--ink-soft); font-size: 15.5px; max-width: 34ch; }

  /* ---------------- buttons ---------------- */
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 15px 20px; border-radius: 14px;
    font-family: var(--display); font-size: 17px; font-weight: 700;
    background: var(--card); border: 2px solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  .btn.solid { background: var(--pink); color: var(--on-pink); }
  .btn.teal  { background: var(--teal); color: var(--on-pink); border-color: var(--ink); }
  .btn.quiet {
    border-color: var(--line); box-shadow: none; background: transparent;
    color: var(--ink-soft); font-weight: 600; font-size: 15px; padding: 12px;
  }
  .btn.quiet:active { transform: scale(.97); box-shadow: none; }
  .btn:disabled { opacity: .4; cursor: default; }
  .row { display: flex; gap: 10px; }

  /* ---------------- segmented controls ---------------- */
  .seg { display: flex; flex-direction: column; gap: 7px; }
  .seg > .lbl {
    font-family: var(--mono); font-size: 10.5px;
    letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft);
  }
  .seg .opts { display: flex; gap: 7px; }
  .seg .opts button {
    flex: 1; padding: 10px 6px; border-radius: 11px;
    font-family: var(--display); font-weight: 700; font-size: 14.5px;
    background: var(--card); border: 2px solid var(--line);
    color: var(--ink-soft);
    transition: transform .1s ease;
  }
  .seg .opts button:active { transform: scale(.96); }
  .seg .opts button[aria-pressed="true"] {
    border-color: var(--ink); color: var(--ink);
    box-shadow: 2px 2px 0 var(--ink);
  }

  .waitbar {
    display: flex; align-items: center; justify-content: center; gap: 9px;
    font-family: var(--mono); font-size: 11.5px;
    letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-soft);
    border: 2px dashed var(--line); border-radius: 12px;
    padding: 13px 12px;
  }
  .waitbar .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--teal); flex: none;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }

  .invitebox {
    width: 100%;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.5;
    padding: 11px 13px; border-radius: 11px; resize: none;
    border: 2px solid var(--line); background: var(--card); color: var(--ink);
  }

  .bigcode {
    user-select: all; -webkit-user-select: all;
    font-family: var(--mono);
    font-size: clamp(34px, 12vw, 52px);
    font-weight: 700;
    letter-spacing: .22em;
    text-align: center;
    padding: 22px 10px 20px;
    color: var(--ink);
    background: var(--card);
    border: 2px dashed var(--ink);
    border-radius: 16px;
    text-indent: .22em;
  }

  .names { display: flex; gap: 8px; }
  .names input {
    flex: 1; min-width: 0;
    font-family: var(--display); font-size: 15px; font-weight: 700;
    padding: 11px 13px; border-radius: 11px;
    border: 2px solid var(--line); background: var(--card); color: var(--ink);
  }
  .names input::placeholder { color: var(--ink-soft); font-weight: 500; }

  /* ---------------- category list ---------------- */
  .cats { display: flex; flex-direction: column; gap: 9px; }
  .cat {
    display: flex; align-items: center; gap: 13px; text-align: left;
    padding: 13px 15px; border-radius: 13px;
    background: var(--card); border: 2px solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .cat:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  .cat .ico { font-size: 26px; line-height: 1; flex: none; }
  .cat .txt { min-width: 0; flex: 1; }
  .cat .nm { font-family: var(--display); font-weight: 800; font-size: 16.5px; display: block; }
  .cat .bl { font-size: 13px; color: var(--ink-soft); display: block; }
  .cat .cnt {
    font-family: var(--mono); font-size: 11px;
    font-variant-numeric: tabular-nums; color: var(--ink-soft);
    flex: none; text-align: right; line-height: 1.3;
  }
  .cat .cnt b { display: block; color: var(--teal); font-size: 13px; }

  /* ---------------- puzzle card ---------------- */
  .board { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; }

  .card {
    position: relative;
    background: var(--card); border: 2px solid var(--ink);
    border-radius: 18px; box-shadow: 5px 5px 0 var(--ink);
    padding: 18px; transform: rotate(-1.1deg);
    animation: deal .3s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes deal { from { opacity: 0; transform: rotate(3deg) translateY(16px) scale(.96); } }
  .card.shake { animation: shake .38s ease; }
  @keyframes shake {
    0%,100% { transform: rotate(-1.1deg) translateX(0); }
    20% { transform: rotate(-1.1deg) translateX(-9px); }
    40% { transform: rotate(-1.1deg) translateX(8px); }
    60% { transform: rotate(-1.1deg) translateX(-5px); }
    80% { transform: rotate(-1.1deg) translateX(3px); }
  }
  .card.wild { transform: rotate(1.4deg); border-color: var(--teal); box-shadow: 5px 5px 0 var(--teal); }

  .card-top {
    display: flex; align-items: center; gap: 8px;
    padding-bottom: 12px; border-bottom: 2px dashed var(--line);
  }
  .chip {
    font-family: var(--mono); font-size: 10.5px;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--on-pink); background: var(--pink);
    padding: 4px 9px; border-radius: 5px;
  }
  .chip.t { background: var(--teal); }
  .chip.lvl { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
  .card-top .no {
    margin-left: auto; font-family: var(--mono); font-size: 11px;
    font-variant-numeric: tabular-nums; color: var(--ink-soft);
  }

  .puzzle {
    font-size: 56px; line-height: 1.34; text-align: center;
    padding: 28px 4px; letter-spacing: .07em; word-break: break-word;
  }
  .wildq {
    font-family: var(--display); font-size: 25px; line-height: 1.3;
    font-weight: 700; text-wrap: balance; padding: 26px 2px 22px;
  }
  .asks { font-size: 14px; color: var(--ink-soft); margin: 0; }
  .asks b { color: var(--ink); font-family: var(--display); }

  .mask {
    font-family: var(--mono); font-size: 20px; letter-spacing: .26em;
    text-align: center; color: var(--teal);
    padding-bottom: 14px; word-break: break-word; min-height: 1.4em;
  }

  .stamp {
    position: absolute; top: 42%; left: 50%;
    transform: translate(-50%, -50%) rotate(-13deg);
    font-family: var(--display); font-size: 40px; font-weight: 800;
    color: var(--pink); border: 5px solid var(--pink);
    border-radius: 12px; padding: 4px 18px; opacity: .92;
    pointer-events: none; white-space: nowrap;
    animation: thud .3s cubic-bezier(.3,1.5,.5,1) both;
  }
  @keyframes thud {
    from { opacity: 0; transform: translate(-50%,-50%) rotate(-13deg) scale(2.4); }
    to   { opacity: .92; transform: translate(-50%,-50%) rotate(-13deg) scale(1); }
  }

  /* ---------------- answer ---------------- */
  .answer { display: flex; flex-direction: column; gap: 9px; }
  .answer input {
    font-family: var(--display); font-size: 21px; font-weight: 700;
    padding: 13px 16px; border: none; border-bottom: 3px solid var(--ink);
    background: transparent; color: var(--ink);
    width: 100%; border-radius: 0; text-align: center;
  }
  .answer input::placeholder { color: var(--ink-soft); font-weight: 500; opacity: .7; }

  .verdict {
    text-align: center; font-family: var(--display);
    font-weight: 700; font-size: 15px; min-height: 22px;
  }
  .verdict.near { color: var(--pink); }

  .revealed { text-align: center; padding: 4px 0 2px; }
  .revealed .lbl {
    font-family: var(--mono); font-size: 10.5px;
    letter-spacing: .18em; text-transform: uppercase; color: var(--ink-soft);
  }
  .revealed .val {
    font-family: var(--display); font-size: 25px; font-weight: 800;
    color: var(--teal); line-height: 1.2;
  }

  /* ---------------- score strip ---------------- */
  .strip {
    display: flex; gap: 8px;
    font-family: var(--mono); font-size: 10.5px;
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft);
  }
  .strip div {
    flex: 1; text-align: center; background: var(--card);
    border: 2px solid var(--line); border-radius: 10px; padding: 7px 4px;
    min-width: 0;
  }
  .strip b {
    display: block; font-family: var(--display); font-size: 19px;
    font-weight: 800; color: var(--ink);
    font-variant-numeric: tabular-nums; letter-spacing: 0;
  }
  .strip .nm {
    display: block; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .strip .up { border-color: var(--ink); box-shadow: 2px 2px 0 var(--ink); }
  .strip .up b { color: var(--pink); }

  .topbar { display: flex; align-items: center; gap: 10px; }
  .topbar .back {
    font-family: var(--display); font-weight: 700; font-size: 15px;
    color: var(--ink-soft); padding: 4px 0;
  }
  .topbar .right { margin-left: auto; }
  .codebtn {
    font-family: var(--mono); font-size: 11px;
    letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-soft);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 5px 9px;
    transition: transform .1s ease;
  }
  .codebtn:active { transform: scale(.95); }

  .handoff {
    text-align: center; padding: 30px 10px;
    font-family: var(--display);
  }
  .handoff .big { font-size: 30px; font-weight: 800; margin-bottom: 6px; }
  .handoff .sm { font-size: 15px; color: var(--ink-soft); font-family: var(--body); }

  .note {
    display: flex; gap: 10px; align-items: flex-start;
    border: 2px dashed var(--line); border-radius: 13px;
    padding: 12px 14px; font-size: 13.5px; line-height: 1.45; color: var(--ink-soft);
  }
  .note b { color: var(--ink); }

  .tally { display: flex; flex-direction: column; gap: 4px; }
  .tally .line {
    display: flex; gap: 10px; align-items: baseline;
    font-size: 14px; padding: 7px 0; border-bottom: 1px solid var(--line);
  }
  .tally .line .em { font-size: 19px; flex: none; }
  .tally .line .an { font-family: var(--display); font-weight: 700; flex: 1; }
  .tally .line .who { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); flex: none; }
  .tally .line .mk { font-family: var(--mono); font-size: 12px; flex: none; }
  .tally .line .mk.y { color: var(--teal); }
  .tally .line .mk.n { color: var(--ink-soft); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>

<div id="app"></div>

  /* ======================== SHARED GAMES OVER THE WIRE ========================
     Two phones cannot alternate turns without somewhere to keep the turn, so
     a room row on Supabase holds it. We speak to PostgREST with plain fetch:
     no library, no CDN, so this behaves the same wherever the page is served.

     While it is not your turn we poll every couple of seconds. A websocket
     would be tidier, but for a game where a turn takes twenty seconds the
     difference is invisible and polling has far fewer ways to break.

     The card order is never sent. Both sides rebuild the same queue from
     (deck, difficulty, seed), so they cannot disagree about the puzzles. */
  const NET = (() => {
    const cfg = (typeof window !== "undefined" && window.GEMOJI_CONFIG) || {};
    const ready = !!(cfg.supabaseUrl && cfg.supabaseAnonKey);
    const base = ready ? cfg.supabaseUrl.replace(/\/+$/, "") + "/rest/v1/game_rooms" : "";
    const headers = ready ? {
      apikey: cfg.supabaseAnonKey,
      Authorization: "Bearer " + cfg.supabaseAnonKey,
      "Content-Type": "application/json",
      Prefer: "return=representation"
    } : {};

    async function call(url, init) {
      const res = await fetch(url, Object.assign({ headers: headers }, init || {}));
      const body = await res.text();
      if (!res.ok) throw new Error("HTTP " + res.status + " " + body.slice(0, 140));
      return body ? JSON.parse(body) : null;
    }

    return {
      ready: ready,
      async create(row) { const d = await call(base, { method: "POST", body: JSON.stringify(row) }); return d && d[0]; },
      async find(code)  { const d = await call(base + "?code=eq." + encodeURIComponent(code) + "&select=*"); return d && d[0]; },
      async patch(code, fields) {
        const d = await call(base + "?code=eq." + encodeURIComponent(code),
                             { method: "PATCH", body: JSON.stringify(fields) });
        return d && d[0];
      }
    };
  })();

  /* ========================== ANSWER MATCHING ==========================
     Worth getting right. If the game rejects an answer that a person
     would accept, the whole thing feels broken.
  ==================================================================== */

  const norm = s => String(s)
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/&/g, " and ")
    .replace(/[^a-z0-9 ]/g, " ")
    .replace(/\b(the|a|an|of|is|it|to)\b/g, " ")
    .replace(/\s+/g, "")
    .trim();

  const answersFor = it => [it.a].concat(it.alt || []);
  function isCorrect(input, it) {
    const g = norm(input);
    return !!g && answersFor(it).some(a => norm(a) === g);
  }

  // Levenshtein, capped. Only used to tell someone they made a typo.
  function edits(a, b) {
    if (Math.abs(a.length - b.length) > 3) return 99;
    const prev = Array.from({ length: b.length + 1 }, (_, i) => i);
    for (let i = 1; i <= a.length; i++) {
      let diag = prev[0];
      prev[0] = i;
      for (let j = 1; j <= b.length; j++) {
        const tmp = prev[j];
        prev[j] = Math.min(prev[j] + 1, prev[j - 1] + 1, diag + (a[i - 1] === b[j - 1] ? 0 : 1));
        diag = tmp;
      }
    }
    return prev[b.length];
  }
  const isNear = (input, it) => {
    const g = norm(input);
    return g.length > 2 && answersFor(it).some(a => edits(g, norm(a)) <= 2);
  };

  /* ============================ HINT LADDER ============================
     Hints cost nothing and you can always take them. They are built from
     the answer itself, so none of them had to be written by hand.
  ==================================================================== */

  function masked(answer, level) {
    if (level <= 0) return "";
    let flip = 0;
    return answer.split(" ").map(w =>
      w.split("").map((ch, i) => {
        if (!/[a-z0-9]/i.test(ch)) return ch;
        if (i === 0) return ch.toUpperCase();
        if (level >= 2 && (flip++ % 2 === 0)) return ch.toUpperCase();
        return "_";
      }).join("")
    ).join("   ");
  }

  /* Seeded shuffling, so a short code reproduces the exact same round on
     someone else's phone. There is no server here: the code IS the state. */
  function rngFrom(seed) {
    let a = 0;
    for (let k = 0; k < seed.length; k++) a = (a * 31 + seed.charCodeAt(k)) | 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const shuffleWith = (arr, rnd) => {
    const a = arr.slice();
    for (let k = a.length - 1; k > 0; k--) {
      const j = Math.floor(rnd() * (k + 1));
      [a[k], a[j]] = [a[j], a[k]];
    }
    return a;
  };
  const newSeed = () => {
    let s = "";
    for (let k = 0; k < 4; k++) s += "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random() * 32)];
    return s;
  };

  const DECK_IDS = CATS.map(c => c.id).concat(["__mix"]);
  const makeCode = (id, diff, seed) =>
    String.fromCharCode(65 + DECK_IDS.indexOf(id)) + diff + seed;
  function readCode(raw) {
    const s = String(raw || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (s.length !== 6) return null;
    const idx = s.charCodeAt(0) - 65;
    const diff = +s[1];
    if (idx < 0 || idx >= DECK_IDS.length) return null;
    if (!(diff >= 1 && diff <= 4)) return null;
    return { id: DECK_IDS[idx], diff: diff, seed: s.slice(2) };
  }

  const atLevel = c => c.items.filter(it => it.d === P.diff);
  const nameOf = n => (P.names[n] || "").trim() || (n ? "Player 2" : "Player 1");

  function buildQueue(items, rnd, noWild) {
    const wilds = shuffleWith(WILD, rnd);
    const q = [];
    let w = 0;
    items.forEach((item, n) => {
      q.push({ kind: "p", item });
      if (noWild) return;
      // a flirty card every 5th puzzle, never as the very last thing
      if ((n + 1) % 5 === 0 && n < items.length - 1 && w < wilds.length) {
        q.push({ kind: "w", q: wilds[w++] });
      }
    });
    return q;
  }

  function startDeck(id, seed, joined) {
    deckId = id;
    curSeed = seed || newSeed();
    curCode = makeCode(id, P.diff, curSeed);
    isJoin = !!joined;
    codeErr = ""; copied = false;
    const rnd = rngFrom(curCode);
    let items;
    if (id === "__mix") {
      const pool = CATS.flatMap(c => atLevel(c).map(it => Object.assign({ cat: c.name }, it)));
      items = shuffleWith(pool, rnd).slice(0, 15);
      deckName = "Mixed Bag"; deckIcon = "🎲";
    } else {
      const c = CATS.find(x => x.id === id);
      items = shuffleWith(atLevel(c), rnd);
      deckName = c.name; deckIcon = c.icon;
    }
    queue = buildQueue(items, rnd);
    i = 0; guess = ""; hint = 0; solved = false; shown = false;
    verdict = ""; verdictNear = false; log = [];
    turn = 0; scores = [0, 0];
    handoff = false;
    view = inviteFlow ? "invite" : "play";
    render();
  }

  const cur = () => queue[online && room ? room.card_index : i];

  function submit() {
    if (solved || shown) return;
    if (online && !myTurn()) return;
    const it = cur().item;
    if (!guess.trim()) return;
    if (isCorrect(guess, it)) {
      solved = true;
      if (!online) {
        scores[P.duo ? turn : 0]++;
        log.push({ item: it, got: true, by: turn });
      }
      verdict = ""; verdictNear = false;
    } else if (isNear(guess, it)) {
      verdict = "Very close. Check your spelling."; verdictNear = true; shakeNow = true;
    } else {
      verdict = "That's not it. There's a hint button below."; verdictNear = false; shakeNow = true;
    }
    render();
  }

  function giveUp() {
    shown = true;
    if (!online) log.push({ item: cur().item, got: false, by: turn });
    render();
  }

  function advance() {
    if (online && room) return pushTurn(solved, cur().item);
    if (i >= queue.length - 1) {
      if (deckId !== "__mix") {
        const k = deckId + ":" + P.diff;
        P.best[k] = Math.max(P.best[k] || 0, scores[0] + scores[1]);
        save();
      }
      view = "done"; render(); return;
    }
    i++; guess = ""; hint = 0; solved = false; shown = false;
    verdict = ""; verdictNear = false;
    if (P.duo) { turn = 1 - turn; handoff = true; }
    render();
  }

  /* Copying is easy to get wrong. navigator.clipboard.writeText returns a
     promise that can REJECT (not focused, no permission, no user gesture),
     so it has to be awaited. execCommand still works where the async API
     is blocked, and we report failure rather than pretending it worked. */
  const inviteText = () => {
    const where = location.origin + location.pathname.replace(/index\.html$/, "");
    return "Play Emoji Riddles with me. Code " + curCode + "\n" + where;
  };

  async function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* fall through */ }
    }
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return !!ok;
    } catch (e) { return false; }
  }


  /* ---------------- room lifecycle ---------------- */

  const myIdx    = () => (iAmHost ? 0 : 1);
  const myTurn   = () => !online || !room || room.turn === myIdx();
  const myName   = () => (iAmHost ? room.host_name : (room.guest_name || "You"));
  const theirName= () => (iAmHost ? (room.guest_name || "them") : room.host_name);
  const myScore  = () => (iAmHost ? room.host_score : room.guest_score);
  const theirScore=() => (iAmHost ? room.guest_score : room.host_score);

  function rebuildFromRoom(r) {
    P.diff = r.difficulty;
    const rnd = rngFrom(makeCode(r.deck, r.difficulty, r.seed));
    let items;
    if (r.deck === "__mix") {
      const pool = CATS.flatMap(c => atLevel(c).map(it => Object.assign({ cat: c.name }, it)));
      items = shuffleWith(pool, rnd).slice(0, 15);
      deckName = "Mixed Bag"; deckIcon = "🎲";
    } else {
      const c = CATS.find(x => x.id === r.deck);
      items = shuffleWith(atLevel(c), rnd);
      deckName = c.name; deckIcon = c.icon;
    }
    deckId = r.deck;
    curSeed = r.seed;
    curCode = r.code;
    queue = buildQueue(items, rnd, true);   // no wildcards in a remote game
  }

  async function createRoom(deck) {
    busy = true; netErr = ""; render();
    const seed = newSeed();
    const code = makeCode(deck, P.diff, seed);
    try {
      room = await NET.create({
        code: code, deck: deck, difficulty: P.diff, seed: seed,
        host_name: (P.names[0] || "").trim() || "Player 1"
      });
      iAmHost = true; online = true;
      rebuildFromRoom(room);
      view = "lobby";
    } catch (e) {
      /* Most likely the game_rooms table is not there yet. Rather than
         dead-end, drop to the on-device invite: the code still reproduces
         the same round for both people, just without live turns. */
      online = false; room = null;
      netErr = /(\b404\b|does not exist|schema cache)/i.test(e.message)
        ? "Turn-by-turn play is not set up on this site yet, so this code just gives you both the same puzzles."
        : "Could not reach the server. " + e.message + " Falling back to a shared code.";
      busy = false;
      return startDeck(deck);
    }
    busy = false; render(); startPolling();
  }

  async function joinRoom(code) {
    busy = true; netErr = ""; render();
    try {
      const r = await NET.find(code);
      if (!r) { netErr = "No game with that code. Check it and try again."; busy = false; return render(); }
      const name = (P.names[1] || "").trim() || "Player 2";
      room = r.guest_name ? r : await NET.patch(code, { guest_name: name });
      iAmHost = false; online = true;
      rebuildFromRoom(room);
      view = room.finished ? "done" : "play";
    } catch (e) {
      netErr = "Could not join. " + e.message;
    }
    busy = false; render(); startPolling();
  }

  /* Hand the turn over. The scores and history live on the row so both
     players read the same truth rather than each keeping their own tally. */
  async function pushTurn(gotIt, item) {
    busy = true; render();
    const nextIndex = room.card_index + 1;
    try {
      room = await NET.patch(room.code, {
        host_score:  room.host_score  + (gotIt &&  iAmHost ? 1 : 0),
        guest_score: room.guest_score + (gotIt && !iAmHost ? 1 : 0),
        history: (room.history || []).concat([{ p: item.p, a: item.a, got: !!gotIt, by: myIdx() }]),
        card_index: nextIndex,
        turn: 1 - myIdx(),
        finished: nextIndex >= queue.length
      });
      solved = false; shown = false; guess = ""; hint = 0;
      verdict = ""; verdictNear = false;
      view = room.finished ? "done" : "play";
    } catch (e) {
      netErr = "Could not send your turn. " + e.message;
    }
    busy = false; render(); startPolling();
  }

  function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

  /* Pull the row and adopt it. Split out from the timer so the turn handoff
     can be tested without waiting on wall-clock polling. */
  async function refreshRoom() {
    if (!online || !room) return false;
    let r;
    try { r = await NET.find(room.code); }
    catch (e) { return false; }          // a dropped poll is not worth shouting about
    if (!r) return false;

    const changed = r.guest_name !== room.guest_name
                 || r.turn       !== room.turn
                 || r.card_index !== room.card_index
                 || r.finished   !== room.finished;
    room = r;
    if (!changed) return false;

    if (room.finished) view = "done";
    else if (view === "lobby" && room.guest_name) view = "play";

    solved = false; shown = false; guess = ""; hint = 0;
    verdict = ""; verdictNear = false;
    render();
    return true;
  }

  /* Poll only while we are waiting on the other player. */
  function startPolling() {
    stopPolling();
    if (!online || !room) return;
    const waiting = view === "lobby" ? !room.guest_name
                  : view === "play"  ? !myTurn()
                  : false;
    if (!waiting) return;
    pollTimer = setInterval(async () => {
      if (await refreshRoom()) { stopPolling(); startPolling(); }
    }, 2200);
  }

  /* ============================== RENDER ============================== */

  const app = document.getElementById("app");
  const esc = s => String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const title = s => s.replace(/\b[a-z]/g, m => m.toUpperCase());

  function render() {
    app.innerHTML = view === "title" ? titleView()
                  : view === "setup" ? setupView()

                  : view === "invite" ? inviteView()
                  : view === "lobby"  ? lobbyView()
                  : view === "play"  ? (online && !myTurn() ? waitingView()
                                        : handoff ? handoffView() : playView())
                  : doneView();
    wire();
    if (shakeNow) {
      const c = app.querySelector(".card");
      if (c) { c.classList.add("shake"); setTimeout(() => c.classList.remove("shake"), 400); }
      shakeNow = false;
    }
  }

              <span class="chip lvl">${esc(lvl.name)}</span>
              <span class="no">${(online && room ? room.card_index : i) + 1} / ${queue.length}</span>
            </div>
            ${online ? `<p class="asks" style="padding-top:10px">Your turn, <b>${esc(myName())}</b></p>`
              : P.duo ? `<p class="asks" style="padding-top:10px">Answering: <b>${esc(nameOf(turn))}</b></p>` : ""}
            <div class="puzzle">${it.p}</div>
            <div class="mask">${showMask ? esc(masked(it.a, hint)) : ""}</div>
          </div>
          ${body}
        </div>
        ${online && room ? netStrip() : strip()}
      </div>`;
  }

  function strip() {
    if (P.duo) {
      return `
        <div class="strip">
          <div class="${turn === 0 ? "up" : ""}"><b>${scores[0]}</b><span class="nm">${esc(nameOf(0))}</span></div>
          <div class="${turn === 1 ? "up" : ""}"><b>${scores[1]}</b><span class="nm">${esc(nameOf(1))}</span></div>
          <div><b>${queue.length - i - 1}</b><span class="nm">left</span></div>
        </div>`;
    }
    return `
      <div class="strip">
        <div><b>${scores[0]}</b><span class="nm">right</span></div>
        <div><b>${queue.length - i - 1}</b><span class="nm">left</span></div>
      </div>`;
  }

  /* ---- results ---- */
  function doneView() {
    const puzzles = queue.filter(c => c.kind === "p").length;
    const rows = online && room ? (room.history || []).map(h => ({ item: { p: h.p, a: h.a }, got: h.got, by: h.by })) : log;
    const got = rows.filter(l => l.got).length;
    const pct = puzzles ? Math.round((got / puzzles) * 100) : 0;

    let head, sub;
    if (online && room) {
      head = `${myName()} ${myScore()} · ${theirScore()} ${theirName()}`;
      sub = myScore() === theirScore() ? "A draw, so you will have to settle it another way."
          : myScore() > theirScore() ? "You take it." : `${theirName()} takes it.`;
    } else if (P.duo) {
      const [a, b] = scores;
      head = `${nameOf(0)} ${a} · ${b} ${nameOf(1)}`;
      sub = a === b ? "A draw, which means you have to play again."
          : `${nameOf(a > b ? 0 : 1)} takes it.`;
    } else {
      head = `${got} out of ${puzzles}`;
      sub = pct === 100 ? "A perfect run, which almost nobody gets first time."
          : pct >= 80   ? "That's a strong score. You clearly know your emoji."
          : pct >= 50   ? "Right around the middle, which is where most people land."
          : pct >= 25   ? "That deck went badly, but you'll remember these next time."
          :               "These are genuinely hard. A second run usually goes much better.";
    }

    const line = l => `
      <div class="line">
        <span class="em">${l.item.p}</span>
        <span class="an">${esc(title(l.item.a))}</span>
        ${online && room ? `<span class="who">${esc(l.by === myIdx() ? myName() : theirName())}</span>`
          : P.duo ? `<span class="who">${esc(nameOf(l.by))}</span>` : ""}
        <span class="mk ${l.got ? "y" : "n"}">${l.got ? "got it" : "missed"}</span>
      </div>`;

    return `
      <div class="screen">
        <header>
          <p class="eyebrow">${deckIcon} ${esc(deckName)} · ${esc(LEVELS.find(l => l.d === P.diff).name.toLowerCase())}</p>
          <h1>${esc(head)}</h1>
          <p class="lede">${esc(sub)}</p>
        </header>
        <div class="tally">${rows.map(line).join("")}</div>

        <div class="note">
          <span>🔗</span>
          <span>${isJoin
            ? `You played code <b>${esc(curCode)}</b>. Send your score back and see who did better.`
            : `Send <b>${esc(curCode)}</b> to someone. They get these exact puzzles in this exact order, so the scores actually compare.`}</span>
        </div>
        <button class="btn quiet" data-act="copy">${copied ? "Copied ✓" : "Copy code " + esc(curCode)}</button>

        ${online && room ? "" : `<button class="btn solid" data-act="again">Play this deck again 🔁</button>`}
        <div class="row">
          <button class="btn quiet" data-go="setup">Another deck</button>
          <button class="btn quiet" data-go="title">Home</button>
        </div>
      </div>`;
  }

  /* ============================== EVENTS ============================== */

  function wire() {
    app.querySelectorAll("[data-set]").forEach(b => {
      b.onclick = () => {
        const v = +b.dataset.val;
        if (b.dataset.set === "duo") P.duo = !!v; else P.diff = v;
        save(); render();
      };
    });

    app.querySelectorAll("[data-name]").forEach(inp => {
      inp.oninput = () => { P.names[+inp.dataset.name] = inp.value; save(); };
    });

    const box = app.querySelector("[data-invite]");
    if (box) box.onclick = () => { box.focus(); box.select(); };

    const code = app.querySelector("[data-code]");
    if (code) {
      code.oninput = () => { codeInput = code.value; };
      code.onkeydown = e => {
        if (e.key === "Enter") {
          e.preventDefault();
          const parsed = readCode(codeInput);
          if (!parsed) { codeErr = "That code doesn't look right. It's 6 characters."; return render(); }
          if (NET.ready) { joinRoom(codeInput.toUpperCase().replace(/[^A-Z0-9]/g, "")); return; }
          P.diff = parsed.diff; save();
          startDeck(parsed.id, parsed.seed, true);
        }
      };
    }

    app.querySelectorAll("[data-deck]").forEach(b => {
      b.onclick = () => {
        if (inviteFlow && NET.ready) return createRoom(b.dataset.deck);
        startDeck(b.dataset.deck);
      };
    });

    app.querySelectorAll("[data-go]").forEach(b => {
      b.onclick = () => {
        view = b.dataset.go;
        handoff = false; codeErr = ""; shareNote = ""; netErr = "";
        if (view === "title") {
          inviteFlow = false;
          stopPolling();
          online = false; room = null;
        }
        render();
      };
    });

    app.querySelectorAll("[data-act]").forEach(b => {
      b.onclick = async () => {
        const a = b.dataset.act;
        if (a === "check")    return submit();
        if (a === "hint")     { hint = Math.min(2, hint + 1); verdict = ""; return render(); }
        if (a === "giveup")   return giveUp();
        if (a === "next")     return advance();
        if (a === "skipwild") return advance();
        if (a === "ready")    { handoff = false; return render(); }
        if (a === "again")    return startDeck(deckId);
        if (a === "solo")   { inviteFlow = false; view = "setup"; codeErr = ""; return render(); }
        if (a === "invite") { inviteFlow = true;  view = "setup"; codeErr = ""; return render(); }
        if (a === "recheck") {
          busy = true; render();
          await refreshRoom();
          busy = false; render(); startPolling();
          return;
        }
        if (a === "beginplay") { view = "play"; shareNote = ""; return render(); }
        if (a === "share") {
          const msg = inviteText();
          if (navigator.share) {
            try {
              await navigator.share({ title: "Emoji Riddles", text: msg });
              shareNote = ""; return render();
            } catch (e) {
              if (e && e.name === "AbortError") return;   // they closed the sheet
            }
          }
          const ok = await copyText(msg);
          shareNote = ok
            ? "Invite copied. Paste it into any chat."
            : "Copy the message in the box below and send it.";
          return render();
        }
        if (a === "copy") {
          const ok = await copyText(curCode);
          copied = ok;
          shareNote = ok ? "" : "Could not copy. Select the code above and copy it by hand.";
          render();
          if (ok) setTimeout(() => { copied = false; render(); }, 1600);
          return;
        }
        if (a === "join") {
          const parsed = readCode(codeInput);
          if (!parsed) { codeErr = "That code doesn't look right. It's 6 characters."; return render(); }
          if (NET.ready) return joinRoom(parsed.seed ? codeInput.toUpperCase().replace(/[^A-Z0-9]/g, "") : codeInput);
          P.diff = parsed.diff; save();
          return startDeck(parsed.id, parsed.seed, true);
        }
      };
    });

    const inp = app.querySelector("#guess");
    if (inp) {
      inp.oninput = () => { guess = inp.value; };
      inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); submit(); } };
      if (guess) { inp.focus(); inp.setSelectionRange(guess.length, guess.length); }
    }
  }

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && online && room) { refreshRoom(); startPolling(); }
  });

  render();
})();
</script>

</body>
</html>
