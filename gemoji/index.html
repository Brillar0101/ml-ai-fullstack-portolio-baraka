<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="Emoji Riddles: 248 rebus puzzles across eight categories and four levels. Play solo, pass the phone, or open a room and take turns with up to ten people." />
<meta name="theme-color" content="#FAEDE3" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#1D1922" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Emoji Riddles" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%A7%A9</text></svg>" />
<link rel="manifest" href="/gemoji/manifest.webmanifest" />
<script>
  /* Values are substituted by Vite at build time from VITE_SUPABASE_*.
     If the vars are unset the literal placeholders survive, so treat any
     value still containing "%VITE_" as absent. */
  (function () {
    var url = "%VITE_SUPABASE_URL%";
    var key = "%VITE_SUPABASE_ANON_KEY%";
    var unset = function (v) { return !v || v.indexOf("%VITE_") === 0; };
    window.GEMOJI_CONFIG = (unset(url) || unset(key))
      ? null
      : { supabaseUrl: url, supabaseAnonKey: key };
  })();
</script>

<title>Emoji Riddles</title>
</head>
<body>
<style>
  :root {
    color-scheme: light dark;

    --paper:    #FAEDE3;
    --card:     #FFF8F3;
    --ink:      #2B2029;
    --ink-soft: #7C6A72;
    --pink:     #DC4C5C;
    --teal:     #1C776E;
    --line:     #E4CDBE;
    --on-pink:  #FFF6F2;

    --display: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
    --body:    system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono:    ui-monospace, "SF Mono", Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1D1922; --card: #292231; --ink: #F7E9E1; --ink-soft: #AC98A4;
      --pink: #FF7A87; --teal: #5CC3B3; --line: #3E3448; --on-pink: #2A1015;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1D1922; --card: #292231; --ink: #F7E9E1; --ink-soft: #AC98A4;
    --pink: #FF7A87; --teal: #5CC3B3; --line: #3E3448; --on-pink: #2A1015;
  }
  :root[data-theme="light"] {
    --paper: #FAEDE3; --card: #FFF8F3; --ink: #2B2029; --ink-soft: #7C6A72;
    --pink: #DC4C5C; --teal: #1C776E; --line: #E4CDBE; --on-pink: #FFF6F2;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  /* Halftone print texture, the thing that makes it read as riso */
  body::before {
    content: "";
    position: fixed; inset: 0; z-index: 0;
    pointer-events: none; opacity: .5;
    background-image: radial-gradient(circle at 50% 50%, var(--line) .9px, transparent 1px);
    background-size: 7px 7px;
  }

  #app {
    position: relative; z-index: 1;
    max-width: 460px; margin: 0 auto;
    padding: 22px 18px calc(28px + env(safe-area-inset-bottom));
    min-height: 100dvh;
    display: flex; flex-direction: column;
  }

  button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }

  .screen {
    display: flex; flex-direction: column; flex: 1; gap: 18px;
    animation: rise .3s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }

  /* ---------------- type ---------------- */
  .eyebrow {
    font-family: var(--mono); font-size: 11px;
    letter-spacing: .18em; text-transform: uppercase;
    color: var(--ink-soft); margin: 0;
  }
  h1 {
    font-family: var(--display); font-size: 36px; line-height: 1.02;
    font-weight: 800; letter-spacing: -.02em; margin: 8px 0 6px;
    text-wrap: balance;
  }
  .lede { margin: 0; color: var(--ink-soft); font-size: 15.5px; max-width: 34ch; }

  /* ---------------- buttons ---------------- */
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 15px 20px; border-radius: 14px;
    font-family: var(--display); font-size: 17px; font-weight: 700;
    background: var(--card); border: 2px solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  .btn.solid { background: var(--pink); color: var(--on-pink); }
  .btn.teal  { background: var(--teal); color: var(--on-pink); border-color: var(--ink); }
  .btn.quiet {
    border-color: var(--line); box-shadow: none; background: transparent;
    color: var(--ink-soft); font-weight: 600; font-size: 15px; padding: 12px;
  }
  .btn.quiet:active { transform: scale(.97); box-shadow: none; }
  .btn:disabled { opacity: .4; cursor: default; }
  .row { display: flex; gap: 10px; }

  /* ---------------- segmented controls ---------------- */
  .seg { display: flex; flex-direction: column; gap: 7px; }
  .seg > .lbl {
    font-family: var(--mono); font-size: 10.5px;
    letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft);
  }
  .seg .opts { display: flex; gap: 7px; }
  .seg .opts button {
    flex: 1; padding: 10px 6px; border-radius: 11px;
    font-family: var(--display); font-weight: 700; font-size: 14.5px;
    background: var(--card); border: 2px solid var(--line);
    color: var(--ink-soft);
    transition: transform .1s ease;
  }
  .seg .opts button:active { transform: scale(.96); }
  .seg .opts button[aria-pressed="true"] {
    border-color: var(--ink); color: var(--ink);
    box-shadow: 2px 2px 0 var(--ink);
  }

  .chattoggle {
    width: 100%; padding: 11px; border-radius: 12px;
    font-family: var(--mono); font-size: 11px;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-soft);
    border: 2px dashed var(--line); background: transparent;
  }
  .chattoggle:active { transform: scale(.98); }

  .chat {
    display: flex; flex-direction: column; gap: 9px;
    border: 2px solid var(--ink); border-radius: 14px;
    background: var(--card); padding: 11px 12px;
  }
  .chat-head { display: flex; align-items: center; }
  .chat-head .lbl {
    font-family: var(--mono); font-size: 10.5px;
    letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft);
  }
  .chatclose {
    margin-left: auto;
    font-family: var(--mono); font-size: 10.5px;
    letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft);
  }
  .chat-log {
    display: flex; flex-direction: column; gap: 6px;
    max-height: 168px; overflow-y: auto;
  }
  .chat-empty {
    margin: 0; font-size: 13px; color: var(--ink-soft);
    font-style: italic;
  }
  .msg { display: flex; flex-direction: column; gap: 1px; }
  .msg .who {
    font-family: var(--mono); font-size: 9.5px;
    letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft);
  }
  .msg .body {
    font-size: 14.5px; line-height: 1.4;
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 10px; padding: 7px 10px;
    align-self: flex-start; max-width: 92%;
    overflow-wrap: anywhere;
  }
  .msg.mine { align-items: flex-end; }
  .msg.mine .body {
    align-self: flex-end;
    background: var(--teal); border-color: var(--teal); color: var(--on-pink);
  }
  .chat-form { display: flex; gap: 7px; }
  .chat-form input {
    flex: 1; min-width: 0; font-size: 15px;
    padding: 10px 12px; border-radius: 10px;
    border: 2px solid var(--line); background: var(--paper); color: var(--ink);
  }
  .chatsend {
    font-family: var(--display); font-weight: 700; font-size: 14px;
    padding: 10px 15px; border-radius: 10px;
    background: var(--pink); color: var(--on-pink);
    border: 2px solid var(--ink);
  }
  .chatsend:disabled { opacity: .35; }

  .pin {
    width: 100%; text-align: center;
    font-family: var(--mono); font-weight: 700;
    font-size: clamp(26px, 9vw, 36px); letter-spacing: .2em; text-indent: .2em;
    padding: 14px 10px; border-radius: 13px;
    border: 2px solid var(--ink); background: var(--card); color: var(--ink);
    text-transform: uppercase;
  }
  .pin::placeholder { color: var(--ink-soft); opacity: .45; letter-spacing: .2em; }

  .roster { display: flex; flex-wrap: wrap; gap: 7px; }
  .roster .who {
    font-family: var(--display); font-weight: 700; font-size: 14.5px;
    padding: 9px 13px; border-radius: 999px;
    border: 2px solid var(--ink); background: var(--card);
    display: inline-flex; align-items: baseline; gap: 6px;
  }
  .roster .who i {
    font-family: var(--mono); font-style: normal; font-size: 10px;
    letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft);
  }
  .roster .who.in { border-color: var(--teal); }
  .roster .who.me { border-color: var(--pink); }
  .roster .who.empty {
    border-style: dashed; border-color: var(--line);
    color: var(--ink-soft); font-weight: 500;
  }

  .alert {
    border: 2px solid var(--pink); border-radius: 13px;
    padding: 12px 14px; font-size: 13.5px; line-height: 1.5;
    color: var(--ink);
  }
  .alert b { display: block; font-family: var(--display); margin-bottom: 3px; }

  .waitbar {
    display: flex; align-items: center; justify-content: center; gap: 9px;
    font-family: var(--mono); font-size: 11.5px;
    letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-soft);
    border: 2px dashed var(--line); border-radius: 12px;
    padding: 13px 12px;
  }
  .waitbar .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--teal); flex: none;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }

  .invitebox {
    width: 100%;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.5;
    padding: 11px 13px; border-radius: 11px; resize: none;
    border: 2px solid var(--line); background: var(--card); color: var(--ink);
  }

  .bigcode {
    user-select: all; -webkit-user-select: all;
    font-family: var(--mono);
    font-size: clamp(34px, 12vw, 52px);
    font-weight: 700;
    letter-spacing: .22em;
    text-align: center;
    padding: 22px 10px 20px;
    color: var(--ink);
    background: var(--card);
    border: 2px dashed var(--ink);
    border-radius: 16px;
    text-indent: .22em;
  }

  .names { display: flex; gap: 8px; }
  .names input {
    flex: 1; min-width: 0;
    font-family: var(--display); font-size: 15px; font-weight: 700;
    padding: 11px 13px; border-radius: 11px;
    border: 2px solid var(--line); background: var(--card); color: var(--ink);
  }
  .names input::placeholder { color: var(--ink-soft); font-weight: 500; }

  /* ---------------- category list ---------------- */
  .cats { display: flex; flex-direction: column; gap: 9px; }
  .cat {
    display: flex; align-items: center; gap: 13px; text-align: left;
    padding: 13px 15px; border-radius: 13px;
    background: var(--card); border: 2px solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .cat:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  .cat .ico { font-size: 26px; line-height: 1; flex: none; }
  .cat .txt { min-width: 0; flex: 1; }
  .cat .nm { font-family: var(--display); font-weight: 800; font-size: 16.5px; display: block; }
  .cat .bl { font-size: 13px; color: var(--ink-soft); display: block; }
  .cat .cnt {
    font-family: var(--mono); font-size: 11px;
    font-variant-numeric: tabular-nums; color: var(--ink-soft);
    flex: none; text-align: right; line-height: 1.3;
  }
  .cat .cnt b { display: block; color: var(--teal); font-size: 13px; }

  /* ---------------- puzzle card ---------------- */
  .board { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; }

  .card {
    position: relative;
    background: var(--card); border: 2px solid var(--ink);
    border-radius: 18px; box-shadow: 5px 5px 0 var(--ink);
    padding: 18px; transform: rotate(-1.1deg);
    animation: deal .3s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes deal { from { opacity: 0; transform: rotate(3deg) translateY(16px) scale(.96); } }
  .card.shake { animation: shake .38s ease; }
  @keyframes shake {
    0%,100% { transform: rotate(-1.1deg) translateX(0); }
    20% { transform: rotate(-1.1deg) translateX(-9px); }
    40% { transform: rotate(-1.1deg) translateX(8px); }
    60% { transform: rotate(-1.1deg) translateX(-5px); }
    80% { transform: rotate(-1.1deg) translateX(3px); }
  }
  .card.wild { transform: rotate(1.4deg); border-color: var(--teal); box-shadow: 5px 5px 0 var(--teal); }

  .card-top {
    display: flex; align-items: center; gap: 8px;
    padding-bottom: 12px; border-bottom: 2px dashed var(--line);
  }
  .chip {
    font-family: var(--mono); font-size: 10.5px;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--on-pink); background: var(--pink);
    padding: 4px 9px; border-radius: 5px;
  }
  .chip.t { background: var(--teal); }
  .chip.lvl { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
  .card-top .no {
    margin-left: auto; font-family: var(--mono); font-size: 11px;
    font-variant-numeric: tabular-nums; color: var(--ink-soft);
  }

  .puzzle {
    font-size: 56px; line-height: 1.34; text-align: center;
    padding: 28px 4px; letter-spacing: .07em; word-break: break-word;
  }
  .wildq {
    font-family: var(--display); font-size: 25px; line-height: 1.3;
    font-weight: 700; text-wrap: balance; padding: 26px 2px 22px;
  }
  .asks { font-size: 14px; color: var(--ink-soft); margin: 0; }
  .asks b { color: var(--ink); font-family: var(--display); }

  .mask {
    font-family: var(--mono); font-size: 20px; letter-spacing: .26em;
    text-align: center; color: var(--teal);
    padding-bottom: 14px; word-break: break-word; min-height: 1.4em;
  }

  .stamp {
    position: absolute; top: 42%; left: 50%;
    transform: translate(-50%, -50%) rotate(-13deg);
    font-family: var(--display); font-size: 40px; font-weight: 800;
    color: var(--pink); border: 5px solid var(--pink);
    border-radius: 12px; padding: 4px 18px; opacity: .92;
    pointer-events: none; white-space: nowrap;
    animation: thud .3s cubic-bezier(.3,1.5,.5,1) both;
  }
  @keyframes thud {
    from { opacity: 0; transform: translate(-50%,-50%) rotate(-13deg) scale(2.4); }
    to   { opacity: .92; transform: translate(-50%,-50%) rotate(-13deg) scale(1); }
  }

  /* ---------------- answer ---------------- */
  .answer { display: flex; flex-direction: column; gap: 9px; }
  .answer input {
    font-family: var(--display); font-size: 21px; font-weight: 700;
    padding: 13px 16px; border: none; border-bottom: 3px solid var(--ink);
    background: transparent; color: var(--ink);
    width: 100%; border-radius: 0; text-align: center;
  }
  .answer input::placeholder { color: var(--ink-soft); font-weight: 500; opacity: .7; }

  .verdict {
    text-align: center; font-family: var(--display);
    font-weight: 700; font-size: 15px; min-height: 22px;
  }
  .verdict.near { color: var(--pink); }

  .revealed { text-align: center; padding: 4px 0 2px; }
  .revealed .lbl {
    font-family: var(--mono); font-size: 10.5px;
    letter-spacing: .18em; text-transform: uppercase; color: var(--ink-soft);
  }
  .revealed .val {
    font-family: var(--display); font-size: 25px; font-weight: 800;
    color: var(--teal); line-height: 1.2;
  }

  /* ---------------- score strip ---------------- */
  .strip {
    display: flex; gap: 8px;
    font-family: var(--mono); font-size: 10.5px;
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft);
  }
  .strip div {
    flex: 1; text-align: center; background: var(--card);
    border: 2px solid var(--line); border-radius: 10px; padding: 7px 4px;
    min-width: 0;
  }
  .strip b {
    display: block; font-family: var(--display); font-size: 19px;
    font-weight: 800; color: var(--ink);
    font-variant-numeric: tabular-nums; letter-spacing: 0;
  }
  .strip .nm {
    display: block; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .strip .up { border-color: var(--ink); box-shadow: 2px 2px 0 var(--ink); }
  .strip .up b { color: var(--pink); }

  .topbar { display: flex; align-items: center; gap: 10px; }
  .topbar .back {
    font-family: var(--display); font-weight: 700; font-size: 15px;
    color: var(--ink-soft); padding: 4px 0;
  }
  .topbar .right { margin-left: auto; }
  .codebtn {
    font-family: var(--mono); font-size: 11px;
    letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-soft);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 5px 9px;
    transition: transform .1s ease;
  }
  .codebtn:active { transform: scale(.95); }

  .handoff {
    text-align: center; padding: 30px 10px;
    font-family: var(--display);
  }
  .handoff .big { font-size: 30px; font-weight: 800; margin-bottom: 6px; }
  .handoff .sm { font-size: 15px; color: var(--ink-soft); font-family: var(--body); }

  .note {
    display: flex; gap: 10px; align-items: flex-start;
    border: 2px dashed var(--line); border-radius: 13px;
    padding: 12px 14px; font-size: 13.5px; line-height: 1.45; color: var(--ink-soft);
  }
  .note b { color: var(--ink); }

  .tally { display: flex; flex-direction: column; gap: 4px; }
  .tally .line {
    display: flex; gap: 10px; align-items: baseline;
    font-size: 14px; padding: 7px 0; border-bottom: 1px solid var(--line);
  }
  .tally .line .em { font-size: 19px; flex: none; }
  .tally .line .an { font-family: var(--display); font-weight: 700; flex: 1; }
  .tally .line .who { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); flex: none; }
  .tally .line .mk { font-family: var(--mono); font-size: 12px; flex: none; }
  .tally .line .mk.y { color: var(--teal); }
  .tally .line .mk.n { color: var(--ink-soft); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>

<div id="app"></div>

<script>
(() => {
  "use strict";

        { p: "🧗‍♂️🪨🧤", a: "bouldering", d: 4 },

  /* ======================== SHARED GAMES OVER THE WIRE ========================
     Two phones cannot alternate turns without somewhere to keep the turn, so
     a room row on Supabase holds it. We speak to PostgREST with plain fetch:
     no library, no CDN, so this behaves the same wherever the page is served.

     While it is not your turn we poll every couple of seconds. A websocket
     would be tidier, but for a game where a turn takes twenty seconds the
     difference is invisible and polling has far fewer ways to break.

     The card order is never sent. Both sides rebuild the same queue from
     (deck, difficulty, seed), so they cannot disagree about the puzzles. */
  const NET = (() => {
    const cfg = (typeof window !== "undefined" && window.GEMOJI_CONFIG) || {};
    const ready = !!(cfg.supabaseUrl && cfg.supabaseAnonKey);
    const root = ready ? cfg.supabaseUrl.replace(/\/+$/, "") : "";
    const base = ready ? root + "/rest/v1/game_rooms" : "";
    const headers = ready ? {
      apikey: cfg.supabaseAnonKey,
      Authorization: "Bearer " + cfg.supabaseAnonKey,
      "Content-Type": "application/json",
      Prefer: "return=representation"
    } : {};

    async function call(url, init) {
      const res = await fetch(url, Object.assign({ headers: headers }, init || {}));
      const body = await res.text();
      if (!res.ok) throw new Error("HTTP " + res.status + " " + body.slice(0, 140));
      return body ? JSON.parse(body) : null;
    }

    return {
      ready: ready,
      async create(row) { const d = await call(base, { method: "POST", body: JSON.stringify(row) }); return d && d[0]; },
      async find(code)  { const d = await call(base + "?code=eq." + encodeURIComponent(code) + "&select=*"); return d && d[0]; },
      async rpc(fn, args) {
        const d = await call(root + "/rest/v1/rpc/" + fn, { method: "POST", body: JSON.stringify(args) });
        return d && d[0];
      },
      async say(code, sender, body) {
        const d = await call(root + "/rest/v1/rpc/append_game_chat", {
          method: "POST",
          body: JSON.stringify({ room_code: code, sender: sender, body: body })
        });
        return d && d[0];
      },
      async patch(code, fields) {
        const d = await call(base + "?code=eq." + encodeURIComponent(code),
                             { method: "PATCH", body: JSON.stringify(fields) });
        return d && d[0];
      }
    };
  })();

  /* ========================== ANSWER MATCHING ==========================
     Worth getting right. If the game rejects an answer that a person
     would accept, the whole thing feels broken.
  ==================================================================== */

  const norm = s => String(s)
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/&/g, " and ")
    .replace(/[^a-z0-9 ]/g, " ")
    .replace(/\b(the|a|an|of|is|it|to)\b/g, " ")
    .replace(/\s+/g, "")
    .trim();

  const answersFor = it => [it.a].concat(it.alt || []);
  function isCorrect(input, it) {
    const g = norm(input);
    return !!g && answersFor(it).some(a => norm(a) === g);
  }

  // Levenshtein, capped. Only used to tell someone they made a typo.
  function edits(a, b) {
    if (Math.abs(a.length - b.length) > 3) return 99;
    const prev = Array.from({ length: b.length + 1 }, (_, i) => i);
    for (let i = 1; i <= a.length; i++) {
      let diag = prev[0];
      prev[0] = i;
      for (let j = 1; j <= b.length; j++) {
        const tmp = prev[j];
        prev[j] = Math.min(prev[j] + 1, prev[j - 1] + 1, diag + (a[i - 1] === b[j - 1] ? 0 : 1));
        diag = tmp;
      }
    }
    return prev[b.length];
  }
  const isNear = (input, it) => {
    const g = norm(input);
    return g.length > 2 && answersFor(it).some(a => edits(g, norm(a)) <= 2);
  };

  /* ============================ HINT LADDER ============================
     Hints cost nothing and you can always take them. They are built from
     the answer itself, so none of them had to be written by hand.
  ==================================================================== */

  function masked(answer, level) {
    if (level <= 0) return "";
    let flip = 0;
    return answer.split(" ").map(w =>
      w.split("").map((ch, i) => {
        if (!/[a-z0-9]/i.test(ch)) return ch;
        if (i === 0) return ch.toUpperCase();
        if (level >= 2 && (flip++ % 2 === 0)) return ch.toUpperCase();
        return "_";
      }).join("")
    ).join("   ");
  }

  /* ============================== STATE ============================== */

  const KEY = "emojiriddles.v2";
  const blank = () => ({ best: {}, diff: 1, duo: false, names: ["", ""] });

  let P = load();
  let view = "title";
  let deckName = "", deckIcon = "", deckId = null;
  let queue = [];            // [{kind:"p", item} | {kind:"w", q}]
  let i = 0;
  let guess = "", hint = 0;
  let solved = false, shown = false;
  let verdict = "", verdictNear = false, shakeNow = false;
  let handoff = false;       // "pass the phone" gate between turns
  let turn = 0;
  let scores = [0, 0];
  let log = [];
  let curSeed = "", curCode = "", isJoin = false, codeErr = "", copied = false, codeInput = "";
  let inviteFlow = false, shareNote = "";
  let online = false, room = null, netErr = "", busy = false, tableMissing = false;
  let pollTimer = null, chatInput = "", chatOpen = false;

  /* One id per device, kept so a refresh rejoins as the same player rather
     than appearing in the room twice. */
  const myId = (() => {
    const K = "emojiriddles.pid";
    try {
      let v = localStorage.getItem(K);
      if (!v) {
        v = "p" + Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6);
        localStorage.setItem(K, v);
      }
      return v;
    } catch { return "p" + Math.random().toString(36).slice(2, 12); }
  })();

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      const p = raw ? JSON.parse(raw) : null;
      return (p && typeof p === "object") ? Object.assign(blank(), p) : blank();
    } catch { return blank(); }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch {} }

  /* Seeded shuffling, so a short code reproduces the exact same round on
     someone else's phone. There is no server here: the code IS the state. */
  function rngFrom(seed) {
    let a = 0;
    for (let k = 0; k < seed.length; k++) a = (a * 31 + seed.charCodeAt(k)) | 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const shuffleWith = (arr, rnd) => {
    const a = arr.slice();
    for (let k = a.length - 1; k > 0; k--) {
      const j = Math.floor(rnd() * (k + 1));
      [a[k], a[j]] = [a[j], a[k]];
    }
    return a;
  };
  const newSeed = () => {
    let s = "";
    for (let k = 0; k < 4; k++) s += "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random() * 32)];
    return s;
  };

  const DECK_IDS = CATS.map(c => c.id).concat(["__mix"]);
  const makeCode = (id, diff, seed) =>
    String.fromCharCode(65 + DECK_IDS.indexOf(id)) + diff + seed;
  function readCode(raw) {
    const s = String(raw || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (s.length !== 6) return null;
    const idx = s.charCodeAt(0) - 65;
    const diff = +s[1];
    if (idx < 0 || idx >= DECK_IDS.length) return null;
    if (!(diff >= 1 && diff <= 4)) return null;
    return { id: DECK_IDS[idx], diff: diff, seed: s.slice(2) };
  }

  const atLevel = c => c.items.filter(it => it.d === P.diff);
  const nameOf = n => (P.names[n] || "").trim() || (n ? "Player 2" : "Player 1");

  function buildQueue(items, rnd, noWild) {
    const wilds = shuffleWith(WILD, rnd);
    const q = [];
    let w = 0;
    items.forEach((item, n) => {
      q.push({ kind: "p", item });
      if (noWild) return;
      // a flirty card every 5th puzzle, never as the very last thing
      if ((n + 1) % 5 === 0 && n < items.length - 1 && w < wilds.length) {
        q.push({ kind: "w", q: wilds[w++] });
      }
    });
    return q;
  }

  function startDeck(id, seed, joined) {
    deckId = id;
    curSeed = seed || newSeed();
    curCode = makeCode(id, P.diff, curSeed);
    isJoin = !!joined;
    codeErr = ""; copied = false;
    const rnd = rngFrom(curCode);
    let items;
    if (id === "__mix") {
      const pool = CATS.flatMap(c => atLevel(c).map(it => Object.assign({ cat: c.name }, it)));
      items = shuffleWith(pool, rnd).slice(0, 15);
      deckName = "Mixed Bag"; deckIcon = "🎲";
    } else {
      const c = CATS.find(x => x.id === id);
      items = shuffleWith(atLevel(c), rnd);
      deckName = c.name; deckIcon = c.icon;
    }
    queue = buildQueue(items, rnd);
    i = 0; guess = ""; hint = 0; solved = false; shown = false;
    verdict = ""; verdictNear = false; log = [];
    turn = 0; scores = [0, 0];
    handoff = false;
    view = inviteFlow ? "invite" : "play";
    render();
  }

  const cur = () => queue[online && room ? room.card_index : i];

  function submit() {
    if (solved || shown) return;
    if (online && !myTurn()) return;
    const it = cur().item;
    if (!guess.trim()) return;
    if (isCorrect(guess, it)) {
      solved = true;
      if (!online) {
        scores[P.duo ? turn : 0] += cardValue();
        log.push({ item: it, got: true, by: turn });
      }
      verdict = ""; verdictNear = false;
    } else if (isNear(guess, it)) {
      verdict = "Very close. Check your spelling."; verdictNear = true; shakeNow = true;
    } else {
      verdict = "That's not it. There's a hint button below."; verdictNear = false; shakeNow = true;
    }
    render();
  }

  function giveUp() {
    shown = true;
    if (!online) log.push({ item: cur().item, got: false, by: turn });
    render();
  }

  function advance() {
    if (online && room) return pushTurn(solved, cur().item);
    if (i >= queue.length - 1) {
      if (deckId !== "__mix") {
        const k = deckId + ":" + P.diff;
        P.best[k] = Math.max(P.best[k] || 0, scores[0] + scores[1]);
        save();
      }
      view = "done"; render(); return;
    }
    i++; guess = ""; hint = 0; solved = false; shown = false;
    verdict = ""; verdictNear = false;
    if (P.duo) { turn = 1 - turn; handoff = true; }
    render();
  }

  /* Copying is easy to get wrong. navigator.clipboard.writeText returns a
     promise that can REJECT (not focused, no permission, no user gesture),
     so it has to be awaited. execCommand still works where the async API
     is blocked, and we report failure rather than pretending it worked. */
  const inviteText = () => {
    const where = location.origin + location.pathname.replace(/index\.html$/, "");
    return "Play Emoji Riddles with me. Code " + curCode + "\n" + where;
  };

  async function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* fall through */ }
    }
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return !!ok;
    } catch (e) { return false; }
  }


  /* ---------------- room lifecycle ---------------- */

  const cardValue = () => POINTS[P.diff] || 100;

  const roster    = () => (room && room.players) || [];
  const meIn      = () => roster().find(p => p.id === myId) || null;
  const upNow     = () => roster()[room ? room.turn : 0] || null;
  const iAmHost   = () => { const r = roster(); return !!r.length && r[0].id === myId; };
  const myTurn    = () => !online || !room ? true : !!(upNow() && upNow().id === myId);
  const myName    = () => (meIn() && meIn().name) || (P.names[0] || "You");
  const upName    = () => (upNow() && upNow().name) || "someone";
  const nameById  = id => { const p = roster().find(x => x.id === id); return p ? p.name : "someone"; };
  const leaderboard = () => roster().slice().sort((a, b) => (b.score || 0) - (a.score || 0));

  function rebuildFromRoom(r) {
    P.diff = r.difficulty;
    const rnd = rngFrom(makeCode(r.deck, r.difficulty, r.seed));
    let items;
    if (r.deck === "__mix") {
      const pool = CATS.flatMap(c => atLevel(c).map(it => Object.assign({ cat: c.name }, it)));
      items = shuffleWith(pool, rnd).slice(0, 15);
      deckName = "Mixed Bag"; deckIcon = "🎲";
    } else {
      const c = CATS.find(x => x.id === r.deck);
      items = shuffleWith(atLevel(c), rnd);
      deckName = c.name; deckIcon = c.icon;
    }
    deckId = r.deck;
    curSeed = r.seed;
    curCode = r.code;
    queue = buildQueue(items, rnd, true);   // no wildcards in a remote game
  }

  async function createRoom(deck) {
    busy = true; netErr = ""; tableMissing = false; render();
    const seed = newSeed();
    const code = makeCode(deck, P.diff, seed);
    const name = (P.names[0] || "").trim() || "Host";
    try {
      room = await NET.create({
        code: code, deck: deck, difficulty: P.diff, seed: seed,
        players: [{ id: myId, name: name.slice(0, 12), score: 0 }]
      });
      online = true;
      rebuildFromRoom(room);
      view = "lobby";
    } catch (e) {
      /* Almost always the one-time SQL has not been run. Say so plainly
         instead of quietly dropping into a mode that looks like broken turns. */
      online = false; room = null;
      tableMissing = /(\b404\b|does not exist|schema cache|Could not find)/i.test(e.message);
      netErr = tableMissing
        ? "Taking turns needs a one-time database setup that is not done yet."
        : "Could not reach the server. " + e.message;
      view = "setup";
    }
    busy = false; render(); startPolling();
  }

  async function joinRoom(code) {
    busy = true; netErr = ""; tableMissing = false; render();
    const name = (P.names[1] || "").trim() || "Player";
    try {
      const r = await NET.rpc("join_game_room", {
        room_code: code, player_id: myId, player_name: name.slice(0, 12)
      });
      if (!r) { netErr = "No game with that PIN. Check it and try again."; busy = false; return render(); }

      room = r; online = true;
      rebuildFromRoom(room);

      if (!meIn()) {
        // the room turned us away: already begun, or full
        netErr = room.started
          ? "That game has already started."
          : "That game is full.";
        online = false; room = null;
        busy = false; return render();
      }
      view = room.finished ? "done" : room.started ? "play" : "lobby";
    } catch (e) {
      tableMissing = /(\b404\b|does not exist|schema cache|Could not find)/i.test(e.message);
      netErr = tableMissing
        ? "Taking turns needs a one-time database setup that is not done yet."
        : "Could not join. " + e.message;
    }
    busy = false; render(); startPolling();
  }

  /* Hand the turn on. The database decides the rotation and the scoring, so
     three or more players cannot trample each other's moves. */
  async function pushTurn(gotIt, item) {
    busy = true; render();
    try {
      const r = await NET.rpc("take_turn", {
        room_code: room.code,
        player_id: myId,
        points: gotIt ? cardValue() : 0,
        card: { p: item.p, a: item.a, got: !!gotIt, by: myId },
        total_cards: queue.length
      });
      if (r) room = r;
      solved = false; shown = false; guess = ""; hint = 0;
      verdict = ""; verdictNear = false;
      view = room.finished ? "done" : "play";
    } catch (e) {
      netErr = "Could not send your turn. " + e.message;
    }
    busy = false; render(); startPolling();
  }

  async function sendChat() {
    const text = chatInput.trim();
    if (!online || !room || !text) return;
    chatInput = ""; render();
    try {
      const r = await NET.say(room.code, myName(), text);
      if (r) room = r;
    } catch (e) {
      netErr = "Message did not send. " + e.message;
    }
    render();
  }

  function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

  /* Pull the row and adopt it. Split out from the timer so the turn handoff
     can be tested without waiting on wall-clock polling. */
  async function refreshRoom() {
    if (!online || !room) return false;
    let r;
    try { r = await NET.find(room.code); }
    catch (e) { return false; }          // a dropped poll is not worth shouting about
    if (!r) return false;

    const chatGrew = (r.chat || []).length !== (room.chat || []).length;
    const changed = (r.players || []).length !== (room.players || []).length
                 || r.started    !== room.started
                 || r.turn       !== room.turn
                 || r.card_index !== room.card_index
                 || r.finished   !== room.finished;
    room = r;
    if (!changed) { if (chatGrew) render(); return false; }

    if (room.finished) view = "done";
    else if (view === "lobby" && room.started) view = "play";

    solved = false; shown = false; guess = ""; hint = 0;
    verdict = ""; verdictNear = false;
    render();
    return true;
  }

  /* Poll only while we are waiting on the other player. */
  function startPolling() {
    stopPolling();
    if (!online || !room) return;
    // Poll for the whole game rather than only while waiting on a turn,
    // otherwise chat would only arrive when it is not your move.
    if (room.finished) return;
    if (view !== "lobby" && view !== "play") return;
    pollTimer = setInterval(async () => {
      if (await refreshRoom()) { stopPolling(); startPolling(); }
    }, 2200);
  }

  /* ============================== RENDER ============================== */

  const app = document.getElementById("app");
  const esc = s => String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const title = s => s.replace(/\b[a-z]/g, m => m.toUpperCase());

  function render() {
    app.innerHTML = view === "title" ? titleView()
                  : view === "setup" ? setupView()
                  : view === "join"  ? joinView()
                  : view === "invite" ? inviteView()
                  : view === "lobby"  ? lobbyView()
                  : view === "play"  ? (online && !myTurn() ? waitingView()
                                        : handoff ? handoffView() : playView())
                  : doneView();
    wire();
    if (shakeNow) {
      const c = app.querySelector(".card");
      if (c) { c.classList.add("shake"); setTimeout(() => c.classList.remove("shake"), 400); }
      shakeNow = false;
    }
  }

  function seg(label, opts) {
    return `
      <div class="seg">
        <span class="lbl">${esc(label)}</span>
        <div class="opts">
          ${opts.map(o => `
            <button type="button" data-set="${o.set}" data-val="${o.val}"
                    aria-pressed="${o.on}">${esc(o.text)}</button>`).join("")}
        </div>
      </div>`;
  }

  /* ---- title ---- */
  function titleView() {
    const total = CATS.reduce((n, c) => n + c.items.length, 0);
    return `
      <div class="screen">
        <div style="flex:1"></div>
        <header>
          <p class="eyebrow">${total} puzzles · 8 categories · 3 levels</p>
          <h1>Emoji Riddles</h1>
          <p class="lede">Read the emoji, type what they spell. Nothing is timed and every hint is free.</p>
        </header>
        <div style="flex:1"></div>
        <button class="btn solid" data-act="solo">Play on my own</button>
        <button class="btn" data-act="invite">Create a game to share</button>
        <button class="btn" data-go="join">Join with a code</button>
      </div>`;
  }

  /* ---- join by PIN, then say who you are ---- */
  function joinView() {
    return `
      <div class="screen">
        <div class="topbar">
          <button class="back" data-go="title">‹ Back</button>
        </div>
        <header>
          <p class="eyebrow">Enter the game</p>
          <h1>Join a game</h1>
          <p class="lede">Type the PIN you were sent, then pick a name for the scoreboard.</p>
        </header>

        <div class="seg">
          <span class="lbl">Game PIN</span>
          <input class="pin" data-code type="text" maxlength="7" autocomplete="off"
                 autocapitalize="characters" autocorrect="off" spellcheck="false"
                 placeholder="C2K7F2" value="${esc(codeInput)}" />
        </div>

        <div class="seg">
          <span class="lbl">Your name</span>
          <div class="names">
            <input data-name="1" type="text" maxlength="12" autocomplete="off"
                   placeholder="What should we call you?" value="${esc(P.names[1])}" />
          </div>
        </div>

        ${codeErr ? `<p class="eyebrow" style="color:var(--pink)">${esc(codeErr)}</p>` : ""}
        ${tableMissing ? `
          <div class="alert">
            <b>Shared rooms are not switched on yet.</b>
            This site needs a one-time database step before a PIN can join you
            to someone else's game.
          </div>` : netErr ? `<p class="eyebrow" style="color:var(--pink)">${esc(netErr)}</p>` : ""}

        <button class="btn solid" data-act="join" ${busy ? "disabled" : ""}>
          ${busy ? "Joining…" : NET.ready ? "Join the game" : "Start these puzzles"}
        </button>
        <div style="flex:1"></div>
      </div>`;
  }

  /* ---- invite: the on-device fallback when there is no shared room ----
     Reached when turn-by-turn is unavailable. Both people get the same round
     from the same code, which is a comparison rather than a shared game. */
  function inviteView() {
    const puzzles = queue.filter(c => c.kind === "p").length;
    const lvl = LEVELS.find(l => l.d === P.diff);
    return `
      <div class="screen">
        <div class="topbar">
          <button class="back" data-go="setup">‹ Back</button>
        </div>
        <header>
          <p class="eyebrow">${deckIcon} ${esc(deckName)} · ${esc(lvl.name.toLowerCase())} · ${cardValue()} pts a card</p>
          <h1>Your game is ready</h1>
          <p class="lede">Send this code. They get the same ${puzzles} puzzles in the same order, so the scores compare.</p>
          ${netErr ? `<p class="eyebrow" style="color:var(--pink)">${esc(netErr)}</p>` : ""}
        </header>

        <div class="bigcode" data-pick>${esc(curCode)}</div>

        <div class="row">
          <button class="btn" data-act="share">Send it</button>
          <button class="btn" data-act="copy">${copied ? "Copied ✓" : "Copy"}</button>
        </div>
        ${shareNote ? `<p class="eyebrow" style="text-align:center; color:var(--pink)">${esc(shareNote)}</p>` : ""}

        <div class="seg">
          <span class="lbl">Or copy this message by hand</span>
          <textarea class="invitebox" data-invite readonly rows="2">${esc(inviteText())}</textarea>
        </div>

        <div style="flex:1"></div>
        <button class="btn teal" data-act="beginplay">Start playing</button>
      </div>`;
  }

  /* ---- setup ---- */
  function setupView() {
    const lvl = LEVELS.find(l => l.d === P.diff);
    const total = CATS.reduce((n, c) => n + atLevel(c).length, 0);

    const row = c => {
      const n = atLevel(c).length;
      const best = P.best[c.id + ":" + P.diff];
      return `
      <button class="cat" data-deck="${c.id}">
        <span class="ico">${c.icon}</span>
        <span class="txt">
          <span class="nm">${esc(c.name)}</span>
          <span class="bl">${esc(c.blurb)}</span>
        </span>
        <span class="cnt">${best != null ? `<b>${best}/${n}</b>best` : `${n}<br>puzzles`}</span>
      </button>`;
    };

    return `
      <div class="screen">
        <div class="topbar">
          <button class="back" data-go="title">‹ Back</button>
        </div>
        <header>
          <p class="eyebrow">${inviteFlow ? "creating a game to share" : `${total} puzzles at ${esc(lvl.name.toLowerCase())}`}</p>
          <h1>${inviteFlow ? "Pick a deck to share" : "Pick a deck"}</h1>
        </header>

        ${seg("Playing", [
          { set: "duo", val: "0", text: "Just me",   on: !P.duo },
          { set: "duo", val: "1", text: "Two of us", on: P.duo }
        ])}

        ${P.duo ? `
          <div class="seg">
            <span class="lbl">Names (optional)</span>
            <div class="names">
              <input data-name="0" type="text" maxlength="12" autocomplete="off"
                     placeholder="Player 1" value="${esc(P.names[0])}" />
              <input data-name="1" type="text" maxlength="12" autocomplete="off"
                     placeholder="Player 2" value="${esc(P.names[1])}" />
            </div>
          </div>` : ""}

        ${seg("Difficulty", LEVELS.map(l => (
          { set: "diff", val: String(l.d), text: l.name, on: P.diff === l.d }
        )))}
        <p class="eyebrow" style="margin-top:-10px">${esc(lvl.note)}</p>

        ${inviteFlow && !NET.ready ? `
          <div class="alert">
            <b>Live rooms are unavailable on this build.</b>
            Picking a deck will give you a code that deals everyone the same
            puzzles instead of a room with turns. The two-player option above
            does take turns, on this one device.
          </div>` : tableMissing ? `
          <div class="alert">
            <b>Taking turns is not switched on yet.</b>
            This site needs a one-time database step before players can share a
            room. Until then, pick a deck below to play on this device: the
            two-player option on this screen still alternates turns and hands
            the phone over.
          </div>` : netErr ? `<p class="eyebrow" style="color:var(--pink)">${esc(netErr)}</p>` : ""}
        <div class="cats">
          ${CATS.map(row).join("")}
          <button class="cat" data-deck="__mix">
            <span class="ico">🎲</span>
            <span class="txt">
              <span class="nm">Mixed Bag</span>
              <span class="bl">15 pulled at random from all eight</span>
            </span>
            <span class="cnt">15<br>puzzles</span>
          </button>
        </div>

      </div>`;
  }


  /* ---- lobby: everyone gathers, the host decides when to begin ---- */
  function lobbyView() {
    const lvl = LEVELS.find(l => l.d === P.diff);
    const ps = roster();
    const enough = ps.length >= 2;

    const chips = ps.map((p, n) => `
      <span class="who ${p.id === myId ? "me" : "in"}">
        ${esc(p.name)}${n === 0 ? " <i>host</i>" : ""}${p.id === myId && n !== 0 ? " <i>you</i>" : ""}
      </span>`).join("");

    if (!iAmHost()) {
      return `
        <div class="screen">
          <div class="topbar"><button class="back" data-go="title">‹ Leave</button></div>
          <header>
            <p class="eyebrow">${deckIcon} ${esc(deckName)} · ${esc(lvl.name.toLowerCase())} · ${cardValue()} pts a card</p>
            <h1>You're in</h1>
            <p class="lede">Playing as <b>${esc(myName())}</b>. You take turns, one card each, so nobody answers at the same time.</p>
          </header>

          <div class="seg">
            <span class="lbl">In this room · ${ps.length}</span>
            <div class="roster">${chips}</div>
          </div>

          ${chatPanel()}
          <div style="flex:1"></div>
          <div class="waitbar"><span class="dot"></span>Waiting for ${esc(ps.length ? ps[0].name : "the host")} to start</div>
          <button class="btn quiet" data-act="recheck" ${busy ? "disabled" : ""}>
            ${busy ? "Checking…" : "Check again"}
          </button>
        </div>`;
    }

    return `
      <div class="screen">
        <div class="topbar"><button class="back" data-go="title">‹ Leave</button></div>
        <header>
          <p class="eyebrow">${deckIcon} ${esc(deckName)} · ${esc(lvl.name.toLowerCase())} · ${cardValue()} pts a card</p>
          <h1>Game PIN</h1>
          <p class="lede">They open the game, tap Join, and type this. Play goes round the room, one card each.</p>
        </header>

        <div class="bigcode" data-pick>${esc(curCode)}</div>

        <div class="row">
          <button class="btn" data-act="share">Send it</button>
          <button class="btn" data-act="copy">${copied ? "Copied ✓" : "Copy"}</button>
        </div>
        ${shareNote ? `<p class="eyebrow" style="text-align:center; color:var(--pink)">${esc(shareNote)}</p>` : ""}
        ${netErr ? `<p class="eyebrow" style="color:var(--pink)">${esc(netErr)}</p>` : ""}

        <div class="seg">
          <span class="lbl">In this room · ${ps.length}</span>
          <div class="roster">
            ${chips}
            ${enough ? "" : `<span class="who empty">waiting…</span>`}
          </div>
        </div>

        ${chatPanel()}
        <div style="flex:1"></div>
        ${enough
          ? `<button class="btn solid" data-act="begin" ${busy ? "disabled" : ""}>
               ${busy ? "Starting…" : `Start the game · ${ps.length} players`}
             </button>`
          : `<div class="waitbar"><span class="dot"></span>Waiting for players to join</div>
             <button class="btn quiet" data-act="recheck" ${busy ? "disabled" : ""}>
               ${busy ? "Checking…" : "Check again"}
             </button>`}
      </div>`;
  }

  /* ---- someone else is up, so this screen is deliberately inert ---- */
  function waitingView() {
    const done = (room.history || []).length;
    return `
      <div class="screen">
        <div class="topbar">
          <button class="back" data-go="title">‹ Leave</button>
          <button class="right codebtn" data-act="copy">${copied ? "copied ✓" : "pin " + esc(curCode)}</button>
        </div>
        <div class="board">
          <div class="card">
            <div class="card-top">
              <span class="chip t">${esc(upName())}'s turn</span>
              <span class="no">${Math.min(room.card_index + 1, queue.length)} / ${queue.length}</span>
            </div>
            <div class="handoff">
              <div class="big">${esc(upName())} is answering</div>
              <div class="sm">Sit tight, you cannot play on someone else's turn. This updates by itself. ${done} card${done === 1 ? "" : "s"} done.</div>
            </div>
          </div>
          <div class="waitbar"><span class="dot"></span>Waiting for ${esc(upName())}</div>
          <button class="btn quiet" data-act="recheck" ${busy ? "disabled" : ""}>
            ${busy ? "Checking…" : "Check again"}
          </button>
        </div>
        ${netStrip()}
        ${chatPanel()}
      </div>`;
  }

  function chatPanel() {
    if (!online || !room) return "";
    const msgs = room.chat || [];
    if (!chatOpen) {
      return `
        <button class="chattoggle" data-act="chatopen">
          Chat${msgs.length ? ` · ${msgs.length}` : ""}
        </button>`;
    }
    const recent = msgs.slice(-30);
    return `
      <div class="chat">
        <div class="chat-head">
          <span class="lbl">Chat</span>
          <button class="chatclose" data-act="chatclose">Hide</button>
        </div>
        <div class="chat-log" data-log>
          ${recent.length
            ? recent.map(m => `
                <div class="msg ${m.n === myName() ? "mine" : ""}">
                  <span class="who">${esc(m.n)}</span>
                  <span class="body">${esc(m.m)}</span>
                </div>`).join("")
            : `<p class="chat-empty">Nothing yet. Say something.</p>`}
        </div>
        <div class="chat-form">
          <input data-chat type="text" maxlength="240" autocomplete="off"
                 placeholder="Message the room" value="${esc(chatInput)}" />
          <button class="chatsend" data-act="chatsend" ${chatInput.trim() ? "" : "disabled"}>Send</button>
        </div>
      </div>`;
  }

  function netStrip() {
    return `
      <div class="strip">
        ${leaderboard().slice(0, 4).map(p => `
          <div class="${upNow() && p.id === upNow().id ? "up" : ""}">
            <b>${p.score || 0}</b>
            <span class="nm">${esc(p.id === myId ? "you" : p.name)}</span>
          </div>`).join("")}
        <div><b>${Math.max(0, queue.length - room.card_index)}</b><span class="nm">left</span></div>
      </div>`;
  }

  /* ---- pass the phone ---- */
  function handoffView() {
    return `
      <div class="screen">
        <div class="topbar">
          <button class="back" data-go="setup">‹ Decks</button>
          <button class="right codebtn" data-act="copy"
                  title="Copy this round's code and send it to someone">
            ${copied ? "copied ✓" : "code " + esc(curCode)}
          </button>
        </div>
        <div class="board">
          <div class="card">
            <div class="handoff">
              <div class="big">${esc(nameOf(turn))}, you're up</div>
              <div class="sm">Pass the phone over, then tap to see the card.</div>
            </div>
          </div>
          <button class="btn solid" data-act="ready">I'm ready</button>
        </div>
        ${strip()}
      </div>`;
  }

  /* ---- play ---- */
  function playView() {
    const c = cur();
    const lvl = LEVELS.find(l => l.d === P.diff);

    if (c.kind === "w") {
      return `
        <div class="screen">
          <div class="topbar">
            <button class="back" data-go="setup">‹ Decks</button>
            <span class="right eyebrow">${deckIcon} ${esc(deckName)}</span>
          </div>
          <div class="board">
            <div class="card wild">
              <div class="card-top">
                <span class="chip t">Wildcard</span>
                <span class="no">${i + 1} / ${queue.length}</span>
              </div>
              ${P.duo ? `<p class="asks" style="padding-top:12px">For <b>${esc(nameOf(turn))}</b></p>` : ""}
              <div class="wildq">${esc(c.q)}</div>
            </div>
            <button class="btn teal" data-act="skipwild">Answered, keep going →</button>
          </div>
          ${strip()}
        </div>`;
    }

    const it = c.item;
    const showMask = hint > 0 && !solved && !shown;

    const body = (solved || shown)
      ? `<div class="revealed">
           <div class="lbl">${solved ? "you said" : "the answer"}</div>
           <div class="val">${esc(title(it.a))}</div>
         </div>
         <button class="btn solid" data-act="next" ${busy ? "disabled" : ""}>
           ${busy ? "Sending…"
             : online ? `Done, next player →`
             : (i >= queue.length - 1 ? "See how you did →" : "Next card →")}
         </button>`
      : `<div class="answer">
           <input id="guess" type="text" inputmode="text" autocomplete="off"
                  autocapitalize="off" autocorrect="off" spellcheck="false"
                  placeholder="type your answer" value="${esc(guess)}" />
           <div class="verdict ${verdictNear ? "near" : ""}">${esc(verdict)}</div>
           <button class="btn solid" data-act="check">Check answer</button>
           <div class="row">
             <button class="btn quiet" data-act="hint" ${hint >= 2 ? "disabled" : ""}>
               ${hint === 0 ? "Hint 💡" : hint === 1 ? "Bigger hint 💡💡" : "That's all the hints"}
             </button>
             <button class="btn quiet" data-act="giveup">Show answer</button>
           </div>
         </div>`;

    return `
      <div class="screen">
        <div class="topbar">
          <button class="back" data-go="setup">‹ Decks</button>
          <button class="right codebtn" data-act="copy"
                  title="Copy this round's code and send it to someone">
            ${copied ? "copied ✓" : "code " + esc(curCode)}
          </button>
        </div>
        <div class="board">
          <div class="card">
            ${solved ? `<div class="stamp">GOT IT</div>` : shown ? `<div class="stamp">ANSWER</div>` : ""}
            <div class="card-top">
              <span class="chip">${esc(it.cat || deckName)}</span>
              <span class="chip lvl">${esc(lvl.name)} · ${cardValue()}</span>
              <span class="no">${(online && room ? room.card_index : i) + 1} / ${queue.length}</span>
            </div>
            ${online ? `<p class="asks" style="padding-top:10px">Your turn, <b>${esc(myName())}</b></p>`
              : P.duo ? `<p class="asks" style="padding-top:10px">Answering: <b>${esc(nameOf(turn))}</b></p>` : ""}
            <div class="puzzle">${it.p}</div>
            <div class="mask">${showMask ? esc(masked(it.a, hint)) : ""}</div>
          </div>
          ${body}
        </div>
        ${online && room ? netStrip() + chatPanel() : strip()}
      </div>`;
  }

  function strip() {
    if (P.duo) {
      return `
        <div class="strip">
          <div class="${turn === 0 ? "up" : ""}"><b>${scores[0]}</b><span class="nm">${esc(nameOf(0))}</span></div>
          <div class="${turn === 1 ? "up" : ""}"><b>${scores[1]}</b><span class="nm">${esc(nameOf(1))}</span></div>
          <div><b>${queue.length - i - 1}</b><span class="nm">left</span></div>
        </div>`;
    }
    return `
      <div class="strip">
        <div><b>${scores[0]}</b><span class="nm">points</span></div>
        <div><b>${queue.length - i - 1}</b><span class="nm">left</span></div>
      </div>`;
  }

  /* ---- results ---- */
  function doneView() {
    const puzzles = queue.filter(c => c.kind === "p").length;
    const rows = online && room ? (room.history || []).map(h => ({ item: { p: h.p, a: h.a }, got: h.got, by: h.by })) : log;
    const got = rows.filter(l => l.got).length;
    const pct = puzzles ? Math.round((got / puzzles) * 100) : 0;

    let head, sub;
    if (online && room) {
      const board = leaderboard();
      const top = board[0], runnerUp = board[1];
      head = board.map(p => `${p.name} ${p.score || 0}`).join(" · ");
      sub = !top ? "Nobody scored."
          : runnerUp && (runnerUp.score || 0) === (top.score || 0)
            ? "A tie at the top, so you will have to settle it another way."
            : top.id === myId ? "You take it." : `${top.name} takes it.`;
    } else if (P.duo) {
      const [a, b] = scores;
      head = `${nameOf(0)} ${a} · ${b} ${nameOf(1)}`;
      sub = a === b ? "A draw, which means you have to play again."
          : `${nameOf(a > b ? 0 : 1)} takes it.`;
    } else {
      head = `${got} out of ${puzzles}`;
      sub = pct === 100 ? "A perfect run, which almost nobody gets first time."
          : pct >= 80   ? "That's a strong score. You clearly know your emoji."
          : pct >= 50   ? "Right around the middle, which is where most people land."
          : pct >= 25   ? "That deck went badly, but you'll remember these next time."
          :               "These are genuinely hard. A second run usually goes much better.";
    }

    const line = l => `
      <div class="line">
        <span class="em">${l.item.p}</span>
        <span class="an">${esc(title(l.item.a))}</span>
        ${online && room ? `<span class="who">${esc(l.by === myId ? "you" : nameById(l.by))}</span>`
          : P.duo ? `<span class="who">${esc(nameOf(l.by))}</span>` : ""}
        <span class="mk ${l.got ? "y" : "n"}">${l.got ? "got it" : "missed"}</span>
      </div>`;

    return `
      <div class="screen">
        <header>
          <p class="eyebrow">${deckIcon} ${esc(deckName)} · ${esc(LEVELS.find(l => l.d === P.diff).name.toLowerCase())}</p>
          <h1>${esc(head)}</h1>
          <p class="lede">${esc(sub)}</p>
        </header>
        <div class="tally">${rows.map(line).join("")}</div>

        <div class="note">
          <span>🔗</span>
          <span>${isJoin
            ? `You played code <b>${esc(curCode)}</b>. Send your score back and see who did better.`
            : `Send <b>${esc(curCode)}</b> to someone. They get these exact puzzles in this exact order, so the scores actually compare.`}</span>
        </div>
        <button class="btn quiet" data-act="copy">${copied ? "Copied ✓" : "Copy code " + esc(curCode)}</button>

        ${online && room ? "" : `<button class="btn solid" data-act="again">Play this deck again 🔁</button>`}
        <div class="row">
          <button class="btn quiet" data-go="setup">Another deck</button>
          <button class="btn quiet" data-go="title">Home</button>
        </div>
      </div>`;
  }

  /* ============================== EVENTS ============================== */

  function wire() {
    app.querySelectorAll("[data-set]").forEach(b => {
      b.onclick = () => {
        const v = +b.dataset.val;
        if (b.dataset.set === "duo") P.duo = !!v; else P.diff = v;
        save(); render();
      };
    });

    app.querySelectorAll("[data-name]").forEach(inp => {
      inp.oninput = () => { P.names[+inp.dataset.name] = inp.value; save(); };
    });

    const chat = app.querySelector("[data-chat]");
    if (chat) {
      chat.oninput = () => {
        const was = !!chatInput.trim();
        chatInput = chat.value;
        // only repaint when the Send button needs to flip state
        if (was !== !!chatInput.trim()) {
          const btn = app.querySelector('[data-act="chatsend"]');
          if (btn) btn.disabled = !chatInput.trim();
        }
      };
      chat.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); sendChat(); } };
      if (chatOpen && chatInput) { chat.focus(); chat.setSelectionRange(chatInput.length, chatInput.length); }
    }
    const logEl = app.querySelector("[data-log]");
    if (logEl) logEl.scrollTop = logEl.scrollHeight;

    const box = app.querySelector("[data-invite]");
    if (box) box.onclick = () => { box.focus(); box.select(); };

    const code = app.querySelector("[data-code]");
    if (code) {
      code.oninput = () => { codeInput = code.value; };
      code.onkeydown = e => {
        if (e.key === "Enter") {
          e.preventDefault();
          const parsed = readCode(codeInput);
          if (!parsed) { codeErr = "That code doesn't look right. It's 6 characters."; return render(); }
          if (NET.ready) { joinRoom(codeInput.toUpperCase().replace(/[^A-Z0-9]/g, "")); return; }
          P.diff = parsed.diff; save();
          startDeck(parsed.id, parsed.seed, true);
        }
      };
    }

    app.querySelectorAll("[data-deck]").forEach(b => {
      b.onclick = () => {
        if (inviteFlow && NET.ready) return createRoom(b.dataset.deck);
        startDeck(b.dataset.deck);
      };
    });

    app.querySelectorAll("[data-go]").forEach(b => {
      b.onclick = () => {
        view = b.dataset.go;
        handoff = false; codeErr = ""; shareNote = ""; netErr = "";
        if (view === "title") {
          inviteFlow = false;
          stopPolling();
          online = false; room = null;
        }
        render();
      };
    });

    app.querySelectorAll("[data-act]").forEach(b => {
      b.onclick = async () => {
        const a = b.dataset.act;
        if (a === "check")    return submit();
        if (a === "hint")     { hint = Math.min(2, hint + 1); verdict = ""; return render(); }
        if (a === "giveup")   return giveUp();
        if (a === "next")     return advance();
        if (a === "skipwild") return advance();
        if (a === "ready")    { handoff = false; return render(); }
        if (a === "again")    return startDeck(deckId);
        if (a === "solo")   { inviteFlow = false; view = "setup"; codeErr = ""; return render(); }
        if (a === "invite") { inviteFlow = true;  view = "setup"; codeErr = ""; return render(); }
        if (a === "chatopen")  { chatOpen = true;  return render(); }
        if (a === "chatclose") { chatOpen = false; return render(); }
        if (a === "chatsend")  return sendChat();
        if (a === "begin") {
          busy = true; render();
          try {
            room = await NET.patch(room.code, { started: true });
            view = "play";
          } catch (e) { netErr = "Could not start. " + e.message; }
          busy = false; render(); startPolling();
          return;
        }
        if (a === "recheck") {
          busy = true; render();
          await refreshRoom();
          busy = false; render(); startPolling();
          return;
        }
        if (a === "beginplay") { view = "play"; shareNote = ""; return render(); }
        if (a === "share") {
          const msg = inviteText();
          if (navigator.share) {
            try {
              await navigator.share({ title: "Emoji Riddles", text: msg });
              shareNote = ""; return render();
            } catch (e) {
              if (e && e.name === "AbortError") return;   // they closed the sheet
            }
          }
          const ok = await copyText(msg);
          shareNote = ok
            ? "Invite copied. Paste it into any chat."
            : "Copy the message in the box below and send it.";
          return render();
        }
        if (a === "copy") {
          const ok = await copyText(curCode);
          copied = ok;
          shareNote = ok ? "" : "Could not copy. Select the code above and copy it by hand.";
          render();
          if (ok) setTimeout(() => { copied = false; render(); }, 1600);
          return;
        }
        if (a === "join") {
          const parsed = readCode(codeInput);
          if (!parsed) { codeErr = "That code doesn't look right. It's 6 characters."; return render(); }
          if (NET.ready) return joinRoom(parsed.seed ? codeInput.toUpperCase().replace(/[^A-Z0-9]/g, "") : codeInput);
          P.diff = parsed.diff; save();
          return startDeck(parsed.id, parsed.seed, true);
        }
      };
    });

    const inp = app.querySelector("#guess");
    if (inp) {
      inp.oninput = () => { guess = inp.value; };
      inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); submit(); } };
      if (guess) { inp.focus(); inp.setSelectionRange(guess.length, guess.length); }
    }
  }

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && online && room) { refreshRoom(); startPolling(); }
  });

  render();
})();
</script>

</body>
</html>
